<!doctype html><meta charset="utf-8"><title>Atlas · SEPS S1 Risk</title><style>body{font-family:system-ui;margin:36px;color:#10233f}code{background:#eef3f8;padding:3px 5px;border-radius:4px}.ok{color:#12805c}.bad{color:#b42332}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid #e5eaf1;text-align:left}</style><h1>Atlas · SEPS S1 Risk</h1><div id="s"></div><h2>Lineage</h2><div id="l"></div><script>Promise.all([fetch('STATE_MANIFEST.json').then(r=>r.json()),fetch('DATA_LINEAGE_GRAPH.json').then(r=>r.json())]).then(([s,l])=>{let u=s.validation?.unresolved||0;document.querySelector('#s').innerHTML=`<p>Versión <b>${s.project.version}</b> · Update <b>${s.release.update}</b> · unresolved: <b class="${u?'bad':'ok'}">${u}</b></p><p>Último corte: <b>${s.database.last_period||'—'}</b></p>`;document.querySelector('#l').innerHTML=l.edges.map(e=>`<p><code>${e.from}</code> —${e.type}→ <code>${e.to}</code></p>`).join('')})</script>
